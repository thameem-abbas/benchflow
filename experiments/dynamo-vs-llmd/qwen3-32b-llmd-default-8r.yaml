apiVersion: benchflow.io/v1alpha1
kind: Experiment
metadata:
  name: qwen3-32b-llmd-dflt-8r
spec:
  model:
    name: Qwen/Qwen3-32B-FP8
  deployment_profile: llm-d-default-routing-ibmcluster
  benchmark_profile: aiperf-mooncake-trace-2k
  metrics_profile: detailed
  namespace: benchflow
  execution:
    timeout: 4h
  overrides:
    scale:
      replicas: 8
  mlflow:
    tags:
      experiment_type: epp-variant
      model: Qwen3-32B-FP8
      accelerator: H100
      framework: llm-d
      epp_config: default-routing (round-robin)
      replicas: "8"
