apiVersion: benchflow.io/v1alpha1
kind: MetricsProfile
metadata:
  name: dynamo
spec:
  prometheus_url: https://thanos-querier.openshift-monitoring.svc:9091
  query_step: 15s
  query_timeout: 30s
  verify_tls: false
  queries:
    # --- Infrastructure ---
    active_pods: count(kube_pod_info{namespace="$namespace", pod=~".*$release.*"})
    avg_gpu_utilization: avg(DCGM_FI_DEV_GPU_UTIL{exported_namespace="$namespace", exported_pod=~".*$release.*"})
    avg_cpu_usage_percent: avg(rate(container_cpu_usage_seconds_total{namespace="$namespace", pod=~".*$release.*"}[5m])) * 100
    avg_memory_working_set_bytes: avg(container_memory_working_set_bytes{namespace="$namespace", pod=~".*$release.*"})

    # --- Dynamo Frontend: throughput ---
    dynamo_requests_total: dynamo_frontend_requests_total{namespace="$namespace"}
    dynamo_request_rate: sum(rate(dynamo_frontend_requests_total{namespace="$namespace"}[5m]))
    dynamo_input_tokens_total: sum(dynamo_frontend_input_sequence_tokens_sum{namespace="$namespace"})
    dynamo_output_tokens_total: sum(dynamo_frontend_output_sequence_tokens_sum{namespace="$namespace"})
    dynamo_input_token_rate: sum(rate(dynamo_frontend_input_sequence_tokens_sum{namespace="$namespace"}[5m]))
    dynamo_output_token_rate: sum(rate(dynamo_frontend_output_sequence_tokens_sum{namespace="$namespace"}[5m]))
    dynamo_queued_requests: dynamo_frontend_queued_requests{namespace="$namespace"}

    # --- Dynamo Frontend: latency ---
    dynamo_ttft_avg_seconds: rate(dynamo_frontend_time_to_first_token_seconds_sum{namespace="$namespace"}[5m]) / clamp_min(rate(dynamo_frontend_time_to_first_token_seconds_count{namespace="$namespace"}[5m]), 1)
    dynamo_itl_avg_seconds: rate(dynamo_frontend_inter_token_latency_seconds_sum{namespace="$namespace"}[5m]) / clamp_min(rate(dynamo_frontend_inter_token_latency_seconds_count{namespace="$namespace"}[5m]), 1)
    dynamo_request_duration_avg_seconds: rate(dynamo_frontend_request_duration_seconds_sum{namespace="$namespace"}[5m]) / clamp_min(rate(dynamo_frontend_request_duration_seconds_count{namespace="$namespace"}[5m]), 1)
    dynamo_avg_input_tokens_per_request: rate(dynamo_frontend_input_sequence_tokens_sum{namespace="$namespace"}[5m]) / clamp_min(rate(dynamo_frontend_input_sequence_tokens_count{namespace="$namespace"}[5m]), 1)
    dynamo_avg_output_tokens_per_request: rate(dynamo_frontend_output_sequence_tokens_sum{namespace="$namespace"}[5m]) / clamp_min(rate(dynamo_frontend_output_sequence_tokens_count{namespace="$namespace"}[5m]), 1)

    # --- Dynamo Component: request plane ---
    dynamo_component_request_rate: sum by (dynamo_component) (rate(dynamo_component_requests_total{namespace="$namespace"}[5m]))
    dynamo_component_request_duration_avg: sum by (dynamo_component) (rate(dynamo_component_request_duration_seconds_sum{namespace="$namespace"}[5m]) / clamp_min(rate(dynamo_component_request_duration_seconds_count{namespace="$namespace"}[5m]), 1))
    dynamo_component_request_bytes_rate: sum by (dynamo_component) (rate(dynamo_component_request_bytes_total{namespace="$namespace"}[5m]))
    dynamo_component_response_bytes_rate: sum by (dynamo_component) (rate(dynamo_component_response_bytes_total{namespace="$namespace"}[5m]))

    # --- Dynamo Component: KV cache ---
    dynamo_gpu_cache_usage_percent: dynamo_component_gpu_cache_usage_percent{namespace="$namespace"}
    dynamo_total_blocks: dynamo_component_total_blocks{namespace="$namespace"}

    # --- Dynamo Operator ---
    dynamo_operator_reconcile_rate: sum(rate(dynamo_operator_reconcile_total[5m]))
    dynamo_operator_reconcile_errors: sum(rate(dynamo_operator_reconcile_errors_total[5m]))

    # --- Per-pod GPU/CPU/memory ---
    gpu_utilization_by_pod: DCGM_FI_DEV_GPU_UTIL{exported_namespace="$namespace", exported_pod=~".*$release.*"}
    gpu_memory_used_by_pod: DCGM_FI_DEV_FB_USED{exported_namespace="$namespace", exported_pod=~".*$release.*"}
    gpu_memory_free_by_pod: DCGM_FI_DEV_FB_FREE{exported_namespace="$namespace", exported_pod=~".*$release.*"}
    cpu_usage_percent_by_pod: rate(container_cpu_usage_seconds_total{namespace="$namespace", pod=~".*$release.*"}[5m]) * 100
    memory_working_set_bytes_by_pod: container_memory_working_set_bytes{namespace="$namespace", pod=~".*$release.*"}
    network_receive_bytes_per_second: rate(container_network_receive_bytes_total{namespace="$namespace", pod=~".*$release.*"}[5m])
    network_transmit_bytes_per_second: rate(container_network_transmit_bytes_total{namespace="$namespace", pod=~".*$release.*"}[5m])
